# 16m x 16m 방 + 칸막이 2개 + 장애물. 칸막이가 S 자 경로를 강제해서 알고리즘 비교에 좋다.
#
#   로봇 시작 (-6, -6) --> 칸막이 1(x=-1) 의 위쪽 틈 --> 칸막이 2(x=4) 의 아래쪽 틈 --> 목표 (6.5, 2)
#
# 시뮬레이션 실행 예: ros2 launch robot_sim sim.launch.py map:=large_room x:=-6.0 y:=-6.0

resolution: 0.05
size: [18.0, 18.0]
room: [16.0, 16.0]
wall_thickness: 0.2

boxes:
  - [-1.0, -3.0, 0.4, 10.0]    # 칸막이 1: y=-8 ~ 2, 위쪽 y=2 ~ 8 이 틈
  - [4.0, 2.5, 0.4, 11.0]      # 칸막이 2: y=-3 ~ 8, 아래쪽 y=-8 ~ -3 이 틈
  - [-4.0, 2.0, 1.5, 1.5]
  - [1.5, -1.0, 1.0, 1.0]
  - [6.5, -5.0, 2.0, 0.8]
disks:
  - [-5.0, -2.0, 0.6]
  - [7.0, 5.0, 0.8]
  - [1.5, 5.5, 0.5]
