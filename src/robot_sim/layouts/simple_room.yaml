# 지도 배치 파일. scripts/make_map.py 가 이 파일에서 지도(PGM+YAML)와 월드(SDF)를 만든다.
# 좌표는 모두 월드(map) 좌표 [m]: x 앞, y 왼쪽, 지도 중앙이 (0, 0)

resolution: 0.05            # 셀 한 칸의 크기 [m]. 작을수록 정밀하지만 느려진다
size: [12.0, 12.0]          # 지도 전체 크기 (가로 x 세로). 방보다 커야 한다
room: [10.0, 10.0]          # 방 안쪽 크기. 벽은 이 바깥쪽에 생긴다
wall_thickness: 0.2

boxes:                      # [중심 x, 중심 y, 가로, 세로]
  - [1.0, 1.0, 1.0, 1.0]
  - [2.0, -2.5, 0.6, 2.0]
  
disks:                      # [중심 x, 중심 y, 반지름]
  - [-2.0, 2.0, 0.4]
